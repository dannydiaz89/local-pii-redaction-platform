name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts-and-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e 'services/inference-python[dev]'
      - name: Run clean quality and build gates
        shell: bash
        run: |
          set -o pipefail
          (pnpm exec tsc -b --clean && pnpm check && pnpm build) 2>&1 | tee .quality-output.log
      - name: Scan quality output for planted privacy canaries
        if: always()
        run: pnpm privacy:scan -- .quality-output.log
